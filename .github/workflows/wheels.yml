# Build wheels and, on a tag, publish them to PyPI.
#
# Publishing uses Trusted Publishing, so there is no API token to store: the
# release job exchanges its GitHub OIDC identity for a short-lived PyPI
# credential.  Configure it once at
# https://pypi.org/manage/project/pybnlearn/settings/publishing/ with this
# repository, workflow name `wheels.yml` and environment `pypi`.

name: wheels

# A full matrix is 30 wheels and 30 runs of the parity suite, the better part
# of an hour, and a documentation commit starts one just as a code commit
# does.  Tempting to add paths-ignore for **/*.md -- but a push filter
# applies to tag pushes too, so the release could stop triggering, and that
# is not a failure anyone would notice until they went looking for a wheel
# that was never built.  The waste is cheaper than the risk.
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-wheels:
    name: ${{ matrix.os }} wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # No macos-13, and so no x86-64 macOS wheels.  That was the last Intel
      # image GitHub hosted and it no longer schedules: the job sat for
      # fifty-eight minutes with an empty runner_name while every other job
      # in the same run finished, and it would have waited out the six-hour
      # timeout.  Building x86-64 by cross-compiling on macos-14 is possible
      # -- Accelerate is a universal framework, so it would link -- but the
      # tests cannot run on the wrong architecture, and an untested wheel is
      # not what this project ships.  Intel Macs build from the sdist.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1
        env:
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev
          python -m pip install build

      - run: python -m build --sdist

      - name: Check the sdist can be built and passes its tests
        run: |
          python -m pip install dist/*.tar.gz
          python -m pip install pytest
          pytest tests -q

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # A rehearsal for the job below, on the one path that a tag cannot be used
  # to test twice: Trusted Publishing either authenticates or it does not, and
  # a version number spent finding that out cannot be spent again.  Run it
  # from the Actions tab (Run workflow) whenever the release machinery
  # changes.
  #
  # skip-existing so that repeating a rehearsal is free -- TestPyPI refuses a
  # version it already has, and there is nothing to learn from that refusal.
  publish-testpypi:
    name: rehearse on TestPyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
