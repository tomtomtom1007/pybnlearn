[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15",
    "meson>=1.1",
    "ninja",
    "Cython>=3.0",
    "numpy>=1.25",
]

[project]
name = "pybnlearn"
version = "0.1.0.dev0"
description = "A Python port of the R package bnlearn: Bayesian network structure learning, parameter learning and inference"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Atomu Matsuda", email = "matsudaatom@gmail.com" }]
keywords = [
    "bayesian networks",
    "structure learning",
    "graphical models",
    "causal discovery",
    "bnlearn",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tommatsuda/pybnlearn"
Issues = "https://github.com/tommatsuda/pybnlearn/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
