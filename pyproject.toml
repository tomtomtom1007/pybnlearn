[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15",
    "meson>=1.1",
    "ninja",
    "Cython>=3.0",
    "numpy>=1.25",
]

[project]
name = "pybnlearn"
version = "0.1.0.dev0"
description = "A Python port of the R package bnlearn: Bayesian network structure learning, parameter learning and inference"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Atomu Matsuda", email = "matsudaatom@gmail.com" }]
keywords = [
    "bayesian networks",
    "structure learning",
    "graphical models",
    "causal discovery",
    "bnlearn",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tommatsuda/pybnlearn"
Issues = "https://github.com/tommatsuda/pybnlearn/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# 3.10 is the floor set by requires-python; PyPy has no NumPy/pandas story
# worth supporting here, and the 32-bit targets cannot host a sane BLAS.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_i686 *_i686 *-win32 pp*"

build-frontend = "build"
test-requires = "pytest"
test-sources = ["tests"]
# The parity fixtures are committed, so CI checks the numbers against R
# without needing R installed.
test-command = "pytest {project}/tests -q"

[tool.cibuildwheel.linux]
# manylinux_2_28 has a recent enough gfortran and OpenBLAS.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "dnf install -y gcc-gfortran openblas-devel"

[tool.cibuildwheel.macos]
before-all = "brew install gfortran openblas"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

# Windows is not built yet.  bnlearn reaches for two LINPACK routines that R
# ships only as Fortran (dqrdc2, dqrsl), and getting a Fortran toolchain and a
# BLAS lined up under MSVC is a project of its own.  Translating those two
# routines to C removes the Fortran dependency altogether and is the intended
# fix; see the note in NOTICE.
