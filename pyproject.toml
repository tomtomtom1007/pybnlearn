[build-system]
build-backend = "mesonpy"
requires = [
    "meson-python>=0.15",
    "meson>=1.1",
    "ninja",
    "Cython>=3.0",
    "numpy>=1.25",
    # Windows has no system BLAS.  It has to be here rather than only in
    # cibuildwheel's before-build, because meson runs inside the isolated
    # build environment that `python -m build` creates, and that environment
    # is built from this list alone -- installing the package outside it
    # leaves meson unable to import it.
    "scipy-openblas32; sys_platform == 'win32'",
]

[project]
name = "bnlearn-port"
version = "0.1.0a1"
description = "A Python port of the R package bnlearn: Bayesian network structure learning, parameter learning and inference"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Atomu Matsuda", email = "matsudaatom@gmail.com" }]
keywords = [
    "bayesian networks",
    "structure learning",
    "graphical models",
    "causal discovery",
    "bnlearn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/tomtomtom1007/pybnlearn"
Issues = "https://github.com/tomtomtom1007/pybnlearn/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
# 3.10 is the floor set by requires-python; PyPy has no NumPy/pandas story
# worth supporting here, and the 32-bit targets cannot host a sane BLAS.
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_i686 *_i686 *-win32 pp*"

build-frontend = "build"
test-requires = "pytest"
test-sources = ["tests"]
# The parity fixtures are committed, so CI checks the numbers against R
# without needing R installed.
#
# test-sources copies `tests` into a scratch directory and runs the command
# there, so the path is relative to that copy.  Naming {project} instead
# would test the source tree rather than the wheel's own copy, which is the
# thing being tested.
test-command = "pytest tests -q"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
# manylinux is RHEL-derived and musllinux is Alpine, so the package manager
# is dnf in one and apk in the other.  The matrix builds both -- ten wheels
# each per architecture -- and a `dnf install` alone fails every musllinux
# build before it starts.
before-all = """
if command -v dnf >/dev/null 2>&1; then dnf install -y openblas-devel;
elif command -v apk >/dev/null 2>&1; then apk add openblas-dev;
else yum install -y openblas-devel; fi
"""

# No before-all: macOS needs no BLAS installed.  meson finds Accelerate
# through its framework method, which is what every macOS build here has
# actually linked -- the `brew install openblas` that used to be on this line
# was never used, and Homebrew said so itself in the CI log ("because macOS
# provides BLAS in Accelerate.framework").  Dropping it removes a step that
# cost time and suggested a dependency that does not exist.
[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

# Windows has no system BLAS, so the build takes the one SciPy ships as a
# wheel -- the same approach NumPy and SciPy use for their own builds.  There
# is no Fortran involved any more: R's two LINPACK routines are translated to
# C in src/c/linpack/, checked against the originals by
# tools/check_linpack.sh.
#
# No PKG_CONFIG_PATH here: meson.build asks the interpreter where the package
# put its headers and library instead.  Writing a .pc file and pointing a
# relative PKG_CONFIG_PATH at it looks right and finds nothing, because
# pkg-config runs with the build directory as its working directory.
[tool.cibuildwheel.windows]
before-build = "pip install delvewheel scipy-openblas32"
repair-wheel-command = "python {package}/tools/repair_windows_wheel.py {dest_dir} {wheel}"
